<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yo'l 3D</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23262b">
</head>
<body>
<section id="garage" class="ui">
  <h1>Garaj</h1>
  <div class="row"><span>Mashina</span><div id="types"></div></div>
  <div class="row"><span>Rang</span><div id="colors"></div></div>
  <div class="row"><span>Sepish</span><div id="sprays"></div></div>
  <div class="row"><span>Davlat</span><div id="country"></div></div>
  <div class="row"><span>Nomer</span><input id="plate" maxlength="12" value="01 A 777 AA"></div>
  <div class="row"><span>Ism</span><input id="nick" maxlength="12" value="Haydovchi"></div>
  <div class="row"><span>Xarita</span><div id="maps"></div></div>
  <div class="row"><span>Grafika</span><div id="quality"></div></div>
  <div class="row"><span>FPS</span><div id="fps"></div></div>
  <button id="start">Shaharga chiqish</button>
  <p class="hint" id="net">Hammasi bepul. W/A/S/D yoki strelkalar, Probel: qo'l tormozi, Shift: nitro, C: kamera, R: radar-detektor.</p>
</section>
<section id="hud" class="ui" hidden>
  <div id="stats"><b id="speed">0</b> km/soat<br><span id="money"></span><br><span id="fines"></span><br><span id="nitro"></span></div>
  <div id="limit">60</div>
  <div id="radar"></div>
  <canvas id="mini" width="150" height="150"></canvas>
  <button id="back">Garaj</button>
  <div id="toast" hidden></div>
  <div id="flash" hidden></div>
  <div id="dialog" hidden>
    <h2>GAI inspektori Dilnoza</h2>
    <p id="dtext"></p>
    <button id="pay">Jarimani to'lash</button>
  </div>
  <div id="touch">
    <button data-k="left">◀</button><button data-k="right">▶</button>
    <button data-k="up">Gaz</button><button data-k="down">Tormoz</button><button data-k="nitro">N2O</button>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
